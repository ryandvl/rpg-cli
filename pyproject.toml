[project]
name = "rpg-cli"
version = "0.1.0"
description = "Python CLI Game about RPG."
readme = "README.md"
authors = [{ name = "ryandvl" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rpg-cli = "rpg_cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.5"]

[lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
venvPath = "."
venv = ".venv"
